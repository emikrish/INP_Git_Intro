name: Update collage

# Rebuilds collage.jpg when a person pushes a photo, so the README stays current.
#
# This is not the only entry point. A push made with GITHUB_TOKEN never raises a
# push event, so a photo merged by the auto-merge bot would never be picked up
# here. auto-merge-photo.yml therefore runs the same script itself after merging.
# Both call .github/scripts/rebuild_collage.sh so the logic exists once.
#
# This cannot retrigger itself: the path filter watches photos/ only, the commit
# it pushes touches collage.jpg only, and it pushes as GITHUB_TOKEN.

on:
  push:
    branches: [master]
    paths:
      - 'photos/**'
  workflow_dispatch:

permissions:
  contents: write

# Shares a group with the job in auto-merge-photo.yml, so two photos landing
# seconds apart cannot race to push collage.jpg.
concurrency:
  group: update-collage
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Rebuild the collage and commit it
        run: bash .github/scripts/rebuild_collage.sh
