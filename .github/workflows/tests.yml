name: Tests

# Guards the two scripts students depend on. The path filter means a pull
# request that only adds a photo never runs this, so students never see a check
# they cannot interpret.

on:
  push:
    branches: [master]
    paths:
      - 'code/**'
      - 'tests/**'
      - '.github/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'code/**'
      - 'tests/**'
      - '.github/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest PyYAML

      - name: Run the test suite
        run: python -m pytest tests/ -v
